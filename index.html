<script>

function delCat(id){ask('Padam kucing ini beserta semua rekodnya?','Padam',()=>{S.cats=S.cats.filter(c=>c.id!==id);S.recs=S.recs.filter(r=>r.cat!==id);save();go('cats');toast('Kucing dipadam')})}
function bkv(){const old=!S.bk||Date.now()-S.bk>2592e6;
return `<button class="bk" onclick="go('more')">‹ Lagi</button><h2 style="margin-top:12px">Backup</h2><p class="mute">Data Kucingku disimpan di telefon ini sahaja. Buat backup berkala supaya data tidak hilang jika data pelayar dibersihkan.</p><div class="card bs" style="margin-top:14px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><div><b>${S.bk?'Backup terakhir':'Belum ada backup'}</b><span class="mute">${S.bk?fd(iso(new Date(S.bk))):'Tekan Export untuk mula.'}</span></div><span class="pill${old?' bad':''}">${old?'Perlu backup':'Selamat'}</span></div><div class="card"><b>Export</b><p class="mute">Simpan fail backup (.json) ke telefon ini.</p><div class="acts"><button class="btn" onclick="exportBk()">Export fail</button><button class="btn g" onclick="copyBk()">Copy</button></div><p class="mute" style="margin-top:8px">Copy akan menyalin teks backup ke clipboard.</p></div><div class="card"><b>Import</b><p class="mute">Pilih fail backup (.json). Data semasa akan diganti.</p><label class="btn fl">Pilih fail<input type="file" accept=".json,application/json" onchange="impFile(this)" hidden></label><details><summary class="mute">Atau tampal teks backup</summary><textarea id="imp" rows="4" placeholder="Tampal teks backup di sini"></textarea><button class="btn g" onclick="impBk()">Import teks</button></details></div>`}
async function getDl(){try{if(typeof claude!=='undefined'&&claude.use){const d=await claude.use('downloads');if(d)return d}}catch(e){}
return{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}}}
async function exportBk(){try{const dl=await getDl();if(!dl){toast('Export tidak tersedia di sini. Guna Copy.');return}
await dl.save({filename:'kucingku-backup-'+td()+'.json',data:JSON.stringify({...S,bk:Date.now()})});S.bk=Date.now();save();render();toast('Fail backup disimpan')}catch(e){if(e&&e.code==='declined')return;toast('Export gagal. Cuba Copy.')}}
function copyBk(){const j=JSON.stringify({...S,bk:Date.now()});(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>{S.bk=Date.now();save();toast('Backup disalin ke clipboard');render()}).catch(()=>toast('Gagal copy. Cuba Export.'))}
function impBk(){impTxt($('#imp').value)}
function impFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>impTxt(r.result);r.readAsText(f);i.value=''}
function impTxt(t){try{const d=JSON.parse(t);if(!d||!Array.isArray(d.cats)||!Array.isArray(d.recs))throw 0;const n=clean(d);ask('Import backup ini? Semua data semasa akan diganti.','Import',()=>{S=n;save();go('home');toast('Import berjaya')})}catch(e){toast('Teks backup tidak sah')}}
try{const r=localStorage.getItem(K);if(r)S=clean(JSON.parse(r))}catch(e){}
render();
</script></body></html>
